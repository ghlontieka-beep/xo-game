# ავტომატური შემოწმება — მუშაობს ყოველ Pull Request-ზე და main-ზე push-ისას.
# ამოწმებს ყველა .js ფაილის სინტაქსს. თუ კოდი გატეხილია → PR-ზე გამოჩნდება წითელი ❌.
name: Code Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: კოდის ჩამოტანა
        uses: actions/checkout@v4

      - name: Node.js-ის დაყენება
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript სინტაქსის შემოწმება
        run: |
          set -e
          found=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            echo "შემოწმება: $f"
            node --check "$f"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "JavaScript ფაილი ვერ მოიძებნა."
          fi
          echo "✅ ყველა JavaScript ფაილის სინტაქსი სწორია."
