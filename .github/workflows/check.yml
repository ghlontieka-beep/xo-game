# ავტომატური შემოწმება — მუშაობს ყოველ Pull Request-ზე და main-ზე push-ისას.
# ამოწმებს ყველა .js ფაილის სინტაქსს. თუ კოდი გატეხილია → PR-ზე გამოჩნდება წითელი ❌.
name: Code Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: კოდის ჩამოტანა
        uses: actions/checkout@v4

      - name: Node.js-ის დაყენება
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript სინტაქსის შემოწმება
        run: |
          set -e
          # სია ცალკე ფაილში, თითო ხაზზე თითო სახელი.
          # `for f in $(find ...)` შედეგს ჰარებზე ჭრიდა და სახელი ჰარით
          # ("my script.js") ორ არარსებულ ფაილად იშლებოდა → ცრუ შეცდომა.
          find . -name "*.js" ! -path "./node_modules/*" ! -path "./.git/*" > /tmp/js-files
          found=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "შემოწმება: $f"
            node --check "$f"
            found=1
          done < /tmp/js-files
          if [ "$found" = "0" ]; then
            echo "JavaScript ფაილი ვერ მოიძებნა."
          fi
          echo "✅ ყველა JavaScript ფაილის სინტაქსი სწორია."
